[package]
name = "burniso-usb"
version = "1.4.12"
description = "Burn ISO to USB und USB Backup Tool für macOS"
authors = ["Norbert Jander"]
edition = "2021"
license = "MIT"
repository = "https://github.com/nojan01/burnISOtoUSB-tauri"
readme = "../README.md"
publish = false

[lib]
name = "burniso_usb_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "=2.7.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex-lite = "0.1"
tokio = { version = "1", features = ["rt", "sync", "time"] }
tauri-plugin-notification = "2.3.3"
libc = "0.2.178"
chrono = "0.4"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
